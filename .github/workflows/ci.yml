name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  db:
    name: Base de datos y Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Levantar Supabase
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,storage-api,mailpit,supavisor,postgres-meta
      - name: Pruebas pgTAP
        run: pnpm test:db
      - name: Tipos generados al día
        run: |
          pnpm -s gen:types
          git diff --exit-code packages/shared/src/database.types.ts
      - name: Pruebas de integración de Edge Functions
        run: |
          pnpm exec supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:54321/functions/v1/ && break
            sleep 2
          done
          pnpm test:integration
      - name: Log de Edge Functions
        if: failure()
        run: cat functions.log || true
